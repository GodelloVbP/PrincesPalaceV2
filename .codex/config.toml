model = "gpt-6-astra"
model_reasoning_effort = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"

[agents.reader]
description = "Read-only repository investigator for bounded searches and file-backed facts."
config_file = "agents/reader.toml"

[agents.implementer]
description = "Programming owner for one bounded issue, including edits and focused verification."
config_file = "agents/implementer.toml"

[agents.verifier]
description = "Runs one named final gate against a fixed repository snapshot and reports without fixing."
config_file = "agents/verifier.toml"
